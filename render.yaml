# =============================================================================
# TERRAE — Render Blueprint Deployment Specification
# =============================================================================
services:
  - type: web
    name: terrae-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FRONTEND_ORIGIN
        value: "*"
      - key: EMBEDDING_PROVIDER
        value: auto
